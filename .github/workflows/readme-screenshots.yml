# The README's pictures, drawn on a runner (CLAUDE.md, «README screenshots»).
#
# `ReadmeScreenshots` draws docs/screenshots/*.png from the recorded Milan, and a change that
# alters what a picture shows must regenerate it in the same change. Until 12 nov 2026 that
# meant compiling the app on the machine of whoever made the change. This runs the same
# command on a runner and uploads the pictures as an artifact: it commits nothing, because
# every regenerated picture is looked at before it is committed (the same rule), and whoever
# asked for them downloads them, looks, and commits the ones that changed.
#
# How to read the artifact: compare each picture with the committed one, byte for byte. A
# picture of a screen the change did not touch comes out identical (12 nov 2026: twelve of
# twelve), so one that differs is a screen that moved. The two of the widgets, widgets.png and
# widget-window.png, differ on a runner whatever the change: the window prints the place's
# hour when the machine's zone is not the place's, and a runner is in UTC. Never commit those
# two from here.
#
# By hand from the Actions tab, on any branch; and on a push that touches this file, so that
# a branch can ask for its pictures before the workflow is on `main` (a workflow can be
# started by hand only once the default branch has it). Never on `main` itself: there the
# pictures are already the committed ones.
name: README screenshots

on:
  push:
    # Branches only, and not main: a tag push ignores the paths filter.
    branches-ignore:
      - main
    paths:
      - .github/workflows/readme-screenshots.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readme-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  draw:
    name: Draw the README's pictures
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The one class, with the property that lets it write: without it the tests are
      # skipped, which is why no ordinary run rewrites a picture.
      - name: Draw
        run: ./gradlew :app:testDebugUnitTest --tests "*ReadmeScreenshots" -PupdateScreenshots

      # Every picture, changed or not: the ones that came out as committed say that nothing
      # else moved, which is half of what the pictures are looked at for.
      - name: Upload the pictures
        uses: actions/upload-artifact@v7
        with:
          name: readme-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: error
          retention-days: 14
